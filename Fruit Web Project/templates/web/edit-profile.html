{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=\, initial-scale=1.0"/>
    <link rel="stylesheet" href="{% static '/styles/styles.css' %}"/>
    <title>Fruit Dictionary</title>
</head>
<body>
<div id="wrapper">
    <header>
        <a id="logo" href="#">
            <img id="logo-img" src="{% static '/images/logo.png' %}" alt="logo"/>
        </a>

        <nav>
            <!-- If there is a user profile -->
            <div class="user">
                <a href="{% url 'dashboard page' %}">Dashboard</a>
                <a href="{% url 'fruit create page' %}">Add Fruit</a>
                <a href="{% url 'profile details page' %}">Profile</a>
            </div>

            <div class="guest">

                <a href="{% url 'profile create page' %}">Create Profile</a>

            </div>
        </nav>
    </header>

    <main>
        <section id="register">
            <div class="form">
                <h2>Edit Profile</h2>
                <form class="register-form">
                    <label for="first-name">First Name:</label>
                    <input
                            type="text"
                            name="first name"
                            id="first-name"
                            value="Mariya"
                    />
                    <label for="last-name">Last Name:</label>
                    <input
                            type="text"
                            name="last name"
                            id="last-name"
                            value="Petrova"
                    />
                    <label for="url">Image URL:</label>
                    <input
                            type="url"
                            name="url"
                            id="url"
                            value="https://images.pexels.com/photos/3792581/pexels-photo-3792581.jpeg"
                    />
                    <label for="age">Age:</label>
                    <input
                            type="number"
                            name="age"
                            id="age"
                            value="18"
                    />
                    <button type="submit">Edit</button>

                </form>
            </div>
        </section>

    </main>
</div>
<footer>
    <p>@Fruit Dictionary. All rights reserved.</p>
</footer>
</body>
</html>
